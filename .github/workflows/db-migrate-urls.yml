name: Migrate Media URLs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - only count affected rows'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  migrate:
    name: Migrate media.topvnsport.com to media.voma.vn
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Run migration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$EC2_USER@$EC2_HOST" 'sudo docker exec pim-api python -c "
          from database import SessionLocal
          from models import ProductMedia
          db = SessionLocal()
          count = db.query(ProductMedia).filter(ProductMedia.image_url.like(\"%media.topvnsport.com%\")).count()
          print(f\"ProductMedia with old URL: {count}\")
          db.close()
          "'
          else
            ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$EC2_USER@$EC2_HOST" 'sudo docker exec pim-api python -c "
          from database import SessionLocal
          from models import ProductMedia
          from sqlalchemy import func
          db = SessionLocal()
          updated = db.query(ProductMedia).filter(ProductMedia.image_url.like(\"%media.topvnsport.com%\")).update({ProductMedia.image_url: func.replace(ProductMedia.image_url, \"media.topvnsport.com\", \"media.voma.vn\")}, synchronize_session=False)
          db.commit()
          print(f\"ProductMedia updated: {updated}\")
          print(\"Migration completed successfully!\")
          db.close()
          "'
          fi
