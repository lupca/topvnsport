name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false  # Don't cancel ongoing deploys

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
      
      - name: Run production deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PUBLIC_HOST: ${{ secrets.PUBLIC_HOST }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          PIM_API_URL: ${{ secrets.PIM_API_URL }}
          OMS_API_URL: ${{ secrets.OMS_API_URL }}
          WMS_API_URL: ${{ secrets.WMS_API_URL }}
          IDENTITY_API_URL: ${{ secrets.IDENTITY_API_URL }}
          PIM_URL: ${{ secrets.PIM_URL }}
          OMS_URL: ${{ secrets.OMS_URL }}
          WMS_URL: ${{ secrets.WMS_URL }}
          IDENTITY_URL: ${{ secrets.IDENTITY_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          FERNET_KEY: ${{ secrets.FERNET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
          ALLOWED_SERVICE_KEYS: ${{ secrets.ALLOWED_SERVICE_KEYS }}
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          RDS_SSLMODE: ${{ secrets.RDS_SSLMODE }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
          DEFAULT_SELLER_TAX_CODE: ${{ secrets.DEFAULT_SELLER_TAX_CODE }}
        run: |
          chmod +x deploy_prod.sh
          ./deploy_prod.sh
      
      - name: Notify deploy success
        if: success()
        run: echo "Deployed successfully to production"
      
      - name: Notify deploy failure
        if: failure()
        run: echo "Deploy failed - check logs"
