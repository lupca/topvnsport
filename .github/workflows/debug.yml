name: Debug Server

on:
  workflow_dispatch:

jobs:
  debug:
    name: Debug Server
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Check nginx and restart
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            echo '=== Check SSL certificates ==='
            ls -la /etc/letsencrypt/live/voma.vn/ 2>&1 || echo 'SSL certs not found'
            echo ''
            echo '=== Nginx logs ==='
            sudo docker logs gateway-nginx --tail 50 2>&1 || true
            echo ''
            echo '=== Restart gateway with PROD config ==='
            cd ~/topvnsport/gateway && sudo docker compose -f docker-compose.prod.yml down && sudo docker compose -f docker-compose.prod.yml up -d
            echo ''
            sleep 10
            echo '=== Container status ==='
            sudo docker ps -a | grep -E 'gateway|nginx'
            echo ''
            echo '=== Health check ==='
            curl -s -o /dev/null -w '%{http_code}' http://localhost/health || echo 'failed'
          "
