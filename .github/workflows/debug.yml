name: Debug Server

on:
  workflow_dispatch:

jobs:
  debug:
    name: Debug Server
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Check nginx and restart
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            echo '=== Nginx logs ==='
            docker logs gateway-nginx --tail 50 2>&1 || true
            echo ''
            echo '=== Restart gateway ==='
            cd ~/topvnsport/gateway && docker compose down && docker compose up -d
            echo ''
            sleep 10
            echo '=== Container status ==='
            docker ps -a | grep -E 'gateway|nginx'
            echo ''
            echo '=== Health check ==='
            curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || echo 'failed'
          "
