# ==============================================
# PRODUCTION LOCATIONS - SUBDOMAIN ROUTING + TLS
# ==============================================

# Internal auth endpoint (shared across all servers)
map $host $auth_backend {
    default identity_api;
}

map $http_origin $cors_allow_origin {
    default "";
    "~^https://([a-z0-9-]+\.)*voma\.vn$" $http_origin;
    "~^https://(www\.)?topvnsport\.com$" $http_origin;
}

# ====================
# HTTP TO HTTPS REDIRECT (PORT 80)
# ====================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME Challenge for Let's Encrypt certbot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check accessible over HTTP for ALB / Docker healthchecks
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Redirect all other unencrypted HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name
        identity.voma.vn
        api-identity.voma.vn
        pim.voma.vn
        api-pim.voma.vn
        oms.voma.vn
        api-oms.voma.vn
        wms.voma.vn
        api-wms.voma.vn
        media.voma.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ====================
# IDENTITY SERVICE (SSO)
# ====================
server {
    listen 443 ssl;
    http2 on;
    server_name identity.voma.vn;

    ssl_certificate /etc/letsencrypt/live/voma.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voma.vn/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Auth endpoints - NO auth required
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://identity_api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Clear client-sent auth headers
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Username "";
        proxy_set_header X-User-Role "";
    }

    # Identity API proxy
    location /identity-api/ {
        proxy_pass http://identity_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Identity Frontend
    location / {
        proxy_pass http://identity_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api-identity.voma.vn;

    ssl_certificate /etc/letsencrypt/live/voma.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voma.vn/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    location / {
        proxy_pass http://identity_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ====================
# PIM SERVICE
# ====================
server {
    listen 443 ssl;
    http2 on;
    server_name pim.voma.vn;

    ssl_certificate /etc/letsencrypt/live/voma.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voma.vn/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location = /auth_verify {
        internal;
        proxy_pass http://identity_api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }

    location @auth_error {
        default_type application/json;
        return 401 '{"detail": "Unauthorized - Please login"}';
    }

    # API proxy for frontend - WITH auth
    location /pmi-api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$cors_allow_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
            add_header 'Access-Control-Max-Age' 1728000;
            return 204;
        }

        auth_request /auth_verify;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_user_username $upstream_http_x_user_username;
        auth_request_set $auth_user_role $upstream_http_x_user_role;
        auth_request_set $auth_user_permissions $upstream_http_x_user_permissions;
        error_page 401 = @auth_error;

        rewrite ^/pmi-api/(.*)$ /$1 break;
        proxy_pass http://pim_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-User-Username $auth_user_username;
        proxy_set_header X-User-Role $auth_user_role;
        proxy_set_header X-User-Permissions $auth_user_permissions;
    }

    location / {
        proxy_pass http://pmi_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

