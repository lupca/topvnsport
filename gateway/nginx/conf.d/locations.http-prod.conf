# ==========================================================
# PRODUCTION LOCATIONS - HTTP REDIRECTS + ACME BOOTSTRAPPING
# ==========================================================

# Docker and load-balancer health checks use the default host locally.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Subdomains are HTTPS-only. ACME remains available for certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name
        identity.voma.vn
        api-identity.voma.vn
        pim.voma.vn
        api-pim.voma.vn
        oms.voma.vn
        api-oms.voma.vn
        wms.voma.vn
        api-wms.voma.vn
        media.voma.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

