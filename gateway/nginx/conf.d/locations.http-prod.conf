# ==========================================================
# PRODUCTION LOCATIONS - HTTP REDIRECTS + ACME BOOTSTRAPPING
# ==========================================================

# Docker and load-balancer health checks use the default host locally.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# voma.vn is HTTPS-only. ACME remains available for certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name
        voma.vn
        www.voma.vn
        identity.voma.vn
        api-identity.voma.vn
        pim.voma.vn
        api-pim.voma.vn
        oms.voma.vn
        api-oms.voma.vn
        wms.voma.vn
        api-wms.voma.vn
        media.voma.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Preserve legacy links while moving PMI naming to PIM.
server { listen 80; listen [::]:80; server_name topvnsport.com; return 301 https://voma.vn$request_uri; }
server { listen 80; listen [::]:80; server_name www.topvnsport.com; return 301 https://www.voma.vn$request_uri; }
server { listen 80; listen [::]:80; server_name identity.topvnsport.com; return 301 https://identity.voma.vn$request_uri; }
server { listen 80; listen [::]:80; server_name api-identity.topvnsport.com; return 301 https://api-identity.voma.vn$request_uri; }
server { listen 80; listen [::]:80; server_name pmi.topvnsport.com; return 301 https://pim.voma.vn$request_uri; }
server { listen 80; listen [::]:80; server_name api-pmi.topvnsport.com; return 301 https://api-pim.voma.vn$request_uri; }
server { listen 80; listen [::]:80; server_name oms.topvnsport.com; return 301 https://oms.voma.vn$request_uri; }
server { listen 80; listen [::]:80; server_name api-oms.topvnsport.com; return 301 https://api-oms.voma.vn$request_uri; }
server { listen 80; listen [::]:80; server_name wms.topvnsport.com; return 301 https://wms.voma.vn$request_uri; }
server { listen 80; listen [::]:80; server_name api-wms.topvnsport.com; return 301 https://api-wms.voma.vn$request_uri; }
server { listen 80; listen [::]:80; server_name media.topvnsport.com; return 301 https://media.voma.vn$request_uri; }
