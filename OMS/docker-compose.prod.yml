version: '3.8'

services:
  oms_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oms_backend
    restart: always
    environment:
      - ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@database-topvnsport.cluster-copm008y8icu.us-east-1.rds.amazonaws.com:5432/oms}
      - FERNET_KEY
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://oms.topvnsport.com}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-identity_jwt_secret_key_2026_change_me_in_prod}
    networks:
      - default
      - pmi_default
      - wms_default

  oms_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://api-oms.topvnsport.com
        - NEXT_PUBLIC_OMS_API_URL=http://api-oms.topvnsport.com
        - NEXT_PUBLIC_WMS_API_URL=http://api-wms.topvnsport.com
        - NEXT_PUBLIC_IDENTITY_URL=http://identity.topvnsport.com
    container_name: oms_frontend
    restart: always
    depends_on:
      - oms_backend
    networks:
      - default
      - pmi_default
      - wms_default

networks:
  default:
    name: oms_default
    external: true
  pmi_default:
    external: true
  wms_default:
    external: true
