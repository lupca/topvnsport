services:
  identity-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env.prod
    container_name: identity-api-prod
    ports:
      - "18110:8000"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ENV=production
    networks:
      - default
      - pmi_default
      - oms_default
      - wms_default

  identity-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://api-identity.topvnsport.com
        - NEXT_PUBLIC_PMI_URL=http://pmi.topvnsport.com
        - NEXT_PUBLIC_OMS_URL=http://oms.topvnsport.com
        - NEXT_PUBLIC_WMS_URL=http://wms.topvnsport.com
    container_name: identity-frontend-prod
    ports:
      - "13110:3000"
    depends_on:
      - identity-api
    networks:
      - default

networks:
  default:
    name: identity_default
  pmi_default:
    external: true
  oms_default:
    external: true
  wms_default:
    external: true
